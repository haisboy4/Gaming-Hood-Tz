backend:
  name: github
  repo: haisboy4/Gaming-Hood-Tz
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "games"
    label: "Games"
    label_singular: "Game"

    files:

      - file: "games.json"
        label: "Game Database"
        name: "games"
        format: "json"

        fields:

          - label: "Games"
            name: "games"
            widget: "list"

            summary: "{{fields.title}}"

            fields:

              - label: "Game Title"
                name: "title"
                widget: "string"

              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "Example: hollowbody"

              - label: "Platform"
                name: "platform"
                widget: "select"
                options:
                  - "Android"
                  - "PC"
                  - "PSP"
                  - "PS Vita"
                  - "Nintendo Wii"
                  - "GameCube"
                  - "Other"

              - label: "Emulator"
                name: "emulator"
                widget: "string"
                required: false

              - label: "Genre"
                name: "genre"
                widget: "list"
                field:
                  label: "Genre"
                  name: "genre"
                  widget: "string"

              - label: "Game Image"
                name: "image"
                widget: "image"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Release Year"
                name: "release_year"
                widget: "number"
                required: false

              - label: "Game Size"
                name: "size_gb"
                widget: "string"
                required: false

              - label: "Build"
                name: "build"
                widget: "string"
                required: false

              - label: "Minimum RAM"
                name: "min_ram"
                widget: "string"
                required: false

              - label: "Recommended RAM"
                name: "recommended_ram"
                widget: "string"
                required: false

              - label: "GPU Requirement"
                name: "gpu"
                widget: "string"
                required: false

              - label: "Offline"
                name: "offline"
                widget: "boolean"
                default: true

              - label: "Controller Supported"
                name: "controller_support"
                widget: "boolean"
                default: false

              - label: "Vulkan Required"
                name: "vulkan_required"
                widget: "boolean"
                default: false

              - label: "Android Version"
                name: "android_support"
                widget: "string"
                required: false

              - label: "FPS - Low"
                name: "fps_low"
                widget: "string"
                required: false

              - label: "FPS - Medium"
                name: "fps_mid"
                widget: "string"
                required: false

              - label: "FPS - High"
                name: "fps_high"
                widget: "string"
                required: false

              - label: "Download Link"
                name: "download_link"
                widget: "string"

              - label: "Emulator Download Link"
                name: "emulator_link"
                widget: "string"
                required: false

              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
                field:
                  label: "Tag"
                  name: "tag"
                  widget: "string"
