backend:
  name: github
  repo: haisboy4/Gaming-Hood-Tz
  branch: main
  # Your actual GitHub Pages site
  site_domain: haisboy4.github.io
  # Cloudflare OAuth Worker
  base_url: https://gaming-hood-cms-auth.haisboy4.workers.dev
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "games"
    label: "Games"
    label_singular: "Game"

    files:

      - file: "/games.json"
        label: "Game Database"
        name: "games"
        format: "json"

        fields:

          - label: "Games"
            name: "games"
            widget: "list"
            summary: "{{fields.title}}"
            add_to_top: true
            label_singular: "Game"

            fields:

              - label: "Game ID"
                name: "id"
                widget: "string"
                hint: "Example: ufc-5"

              - label: "Game Title"
                name: "title"
                widget: "string"

              - label: "Platform"
                name: "platform"
                widget: "select"
                options:
                  - "Android"
                  - "PC"
                  - "Winlator"
                  - "PSP"
                  - "PS Vita"
                  - "PS2"
                  - "Nintendo Wii"
                  - "Wii"
                  - "GameCube"
                  - "Other"

              - label: "Emulator"
                name: "emulator"
                widget: "string"
                required: false

              - label: "Game Image URL"
                name: "image"
                widget: "string"
                required: false
                hint: "Paste the image URL."

              - label: "Game Size"
                name: "size"
                widget: "string"
                required: false

              - label: "Build"
                name: "build"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Genre"
                name: "genre"
                widget: "list"
                required: false
                field:
                  label: "Genre"
                  name: "genre"
                  widget: "string"

              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
                field:
                  label: "Tag"
                  name: "tag"
                  widget: "string"

              - label: "Release Year"
                name: "release_year"
                widget: "number"
                required: false

              - label: "Views"
                name: "views"
                widget: "number"
                default: 0
                required: false

              - label: "Added Date"
                name: "added"
                widget: "date"
                format: "YYYY-MM-DD"
                required: false

              - label: "Minimum RAM (GB)"
                name: "min_ram"
                widget: "number"
                required: false

              - label: "Recommended RAM (GB)"
                name: "recommended_ram"
                widget: "number"
                required: false

              - label: "GPU"
                name: "gpu"
                widget: "string"
                required: false

              - label: "Android Version"
                name: "android_support"
                widget: "string"
                required: false

              - label: "Vulkan Required"
                name: "vulkan_required"
                widget: "boolean"
                default: false
                required: false

              - label: "Offline"
                name: "offline"
                widget: "boolean"
                default: true
                required: false

              - label: "Controller Supported"
                name: "controller_support"
                widget: "boolean"
                default: false
                required: false

              - label: "Multiplayer"
                name: "multiplayer"
                widget: "boolean"
                default: false
                required: false

              - label: "Low FPS"
                name: "fps_low"
                widget: "string"
                required: false

              - label: "Medium FPS"
                name: "fps_mid"
                widget: "string"
                required: false

              - label: "High FPS"
                name: "fps_high"
                widget: "string"
                required: false

              - label: "Download Link"
                name: "download_link"
                widget: "string"
                required: false

              - label: "Emulator Download Link"
                name: "emulator_link"
                widget: "string"
                required: false
